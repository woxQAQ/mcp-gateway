version: '3.8'

services:
  mcp-gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MCP_CONFIG_PATH=/app/config.yaml
      - MCP_LOG_LEVEL=INFO
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Example service for testing
  jsonplaceholder:
    image: mockserver/mockserver:latest
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_PROPERTY_FILE=/config/mockserver.properties
    volumes:
      - ./docker/mockserver-config.json:/config/mockserver-config.json:ro
    profiles:
      - testing

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    profiles:
      - redis

  # Jaeger for tracing (optional)
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    profiles:
      - observability

volumes:
  redis_data:
